name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for keyless auth to GCP via Workload Identity Federation

env:
  PROJECT_ID: research-agent-nk
  REGION: us-central1
  SERVICE: research-agent
  IMAGE: us-central1-docker.pkg.dev/research-agent-nk/research-agent/research-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1038065508967/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@research-agent-nk.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build image
        run: |
          # Submitted --async and polled rather than letting `gcloud builds
          # submit` stream logs directly: log streaming from the default
          # Cloud Build logs bucket requires the primitive Viewer/Owner
          # project role, which we deliberately don't grant the CI service
          # account (it only has the specific roles it needs).
          BUILD_ID=$(gcloud builds submit \
            --project "$PROJECT_ID" \
            --tag "$IMAGE:${{ github.sha }}" \
            --async \
            --format='value(id)')
          echo "Cloud Build ID: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project "$PROJECT_ID" --format='value(status)')
            echo "Status: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Build failed with status: $STATUS"
                exit 1
                ;;
            esac
            sleep 10
          done

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --set-secrets ANTHROPIC_API_KEY=research-agent-anthropic-key:latest,RESEARCH_AGENT_API_KEY=research-agent-api-key:latest \
            --allow-unauthenticated \
            --memory 512Mi \
            --timeout 300
